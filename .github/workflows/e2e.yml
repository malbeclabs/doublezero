name: e2e
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Flake gap-filler, off the congested :00/:30 slots. Daily, not every 6h,
    # because a full run on the larger runners costs about $4.
    - cron: '23 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  SHARD_COUNT: "5"
  ARISTA_CEOS_IMAGE: ghcr.io/malbeclabs/ceos:4.33.1F
  # Copies of upstream images, made with `crane copy` so the digests are the
  # same. The shards pull them with the job token, not anonymously, so registry
  # limits for anonymous pulls cannot fail a shard.
  # docker.io/prom/prometheus:v2.54.1
  DZ_PROMETHEUS_IMAGE: ghcr.io/malbeclabs/e2e-prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
  # public.ecr.aws/influxdb/influxdb:1.8, as pulled in run 45207108458
  DZ_INFLUXDB_IMAGE: ghcr.io/malbeclabs/e2e-influxdb@sha256:951292a96756693195c5a96e11b8e1c79f14749f2c004f1de9ac9d502624188e
  # The local names from e2e/.env.local. Setup builds these, and the shards load
  # them from the artifact, so no image goes to a registry.
  DZ_BASE_IMAGE: dz-local/base:dev
  DZ_LEDGER_IMAGE: dz-local/ledger:dev
  DZ_CONTROLLER_IMAGE: dz-local/controller:dev
  DZ_MANAGER_IMAGE: dz-local/manager:dev
  DZ_FUNDER_IMAGE: dz-local/funder:dev
  DZ_DEVICE_IMAGE: dz-local/device:dev
  DZ_CLIENT_IMAGE: dz-local/client:dev
  DZ_DEVICE_HEALTH_ORACLE_IMAGE: dz-local/device-health-oracle:dev
  DZ_GEOPROBE_IMAGE: dz-local/geoprobe:dev
  DZ_SENTINEL_IMAGE: dz-local/sentinel:dev
  DZ_IP_VERIFIER_IMAGE: dz-local/ip-verifier:dev
  DZ_VALIDATOR_METADATA_SERVICE_MOCK_IMAGE: dz-local/validator-metadata-service-mock:dev

jobs:
  schedule-gate:
    name: Flake gap-filler gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    env:
      # Default-off master switch. Set repo variable E2E_GAP_FILLER_ENABLED='true'
      # to activate (Settings -> Secrets and variables -> Actions -> Variables).
      GAP_FILLER_ENABLED: ${{ vars.E2E_GAP_FILLER_ENABLED }}
    steps:
      - name: Decide whether to run the gap-filler
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.info(`event=${context.eventName}: not the scheduled gap-filler; proceeding`);
              core.setOutput('proceed', 'true');
              return;
            }
            const STALE_HOURS = 6;
            const enabled = process.env.GAP_FILLER_ENABLED === 'true';
            const selfId = context.runId;
            const { owner, repo } = context.repo;

            // Stale check: newest *merge* (push) e2e run on main. Only push events
            // count, because the gap-filler's own scheduled runs are also on main.
            // Missing => Infinity => stale.
            const mainRuns = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'e2e.yml', branch: 'main', event: 'push', per_page: 30,
            });
            const newestMain = mainRuns.data.workflow_runs
              .filter(r => r.id !== selfId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            const ageHours = newestMain
              ? (Date.now() - new Date(newestMain.created_at).getTime()) / 3.6e6
              : Infinity;
            const stale = ageHours >= STALE_HOURS;

            // Idle check: any e2e run not yet completed, on ANY branch, excluding
            // this run. These GitHub run statuses precede 'completed'.
            const active = [];
            for (const status of ['queued', 'in_progress', 'requested', 'waiting', 'pending']) {
              const res = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'e2e.yml', status, per_page: 100,
              });
              active.push(...res.data.workflow_runs.filter(r => r.id !== selfId));
            }
            const idle = active.length === 0;

            const proceed = enabled && stale && idle;
            const ageStr = Number.isFinite(ageHours) ? ageHours.toFixed(1) + 'h' : 'none';
            core.info(`enabled=${enabled} stale=${stale} (newest merge age=${ageStr}, threshold=${STALE_HOURS}h) idle=${idle} (active=${active.length}) => proceed=${proceed}`);
            core.setOutput('proceed', String(proceed));
            await core.summary.addRaw(
              `### e2e flake gap-filler gate\n` +
              `- enabled: **${enabled}**\n` +
              `- stale: **${stale}** (newest merge (push) run age ${ageStr} / ${STALE_HOURS}h)\n` +
              `- idle: **${idle}** (in-flight e2e runs excluding self: ${active.length})\n` +
              `- **proceed: ${proceed}**\n`
            ).write();

  changes:
    # Docs-only and version-bump-only PRs get no signal from e2e. Any doubt (an
    # error, no base commit, or an event that is not a PR) gives run=true.
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for docs/version-bump-only changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u -o pipefail
          # The shards pull the private cEOS image and then run PR code, so a fork PR
          # that needs e2e fails, and e2e-ok fails with it.
          decide() {
            if [ "$1" = true ] && [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
              echo "::error::e2e does not run on fork PRs, because the shards pull the private cEOS image. A maintainer can push the branch to this repo to run it."
              exit 1
            fi
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "run=$1: $2"
            exit 0
          }
          version_lines_only() {
            local lines
            lines=$(git diff -U0 "$BASE" HEAD -- "$1" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ') || true
            [ -n "$lines" ] && ! grep -qvE '^[+-]version = "' <<< "$lines"
          }
          # A push still runs everything, because the gap-filler counts each push run
          # on main as a run of e2e.
          [ "$EVENT" = pull_request ] || decide true "event $EVENT runs everything"
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ || "$BASE" =~ ^0+$ ]]; then
            decide true "no base commit"
          fi
          git fetch --no-tags --depth=1 origin "$BASE" || decide true "cannot fetch $BASE"
          # --no-renames shows a rename as a delete and an add, so both paths must be inert.
          files=$(git diff --no-renames --name-status "$BASE" HEAD) || decide true "cannot diff"
          [ -n "$files" ] || decide true "no changed files"
          cargo_toml=false
          cargo_lock=false
          while IFS=$'\t' read -r status path; do
            case "$path" in
              *.md) continue ;;
              rfcs/*)
                if [[ "${path,,}" =~ \.(png|jpe?g|gif|svg|webp)$ ]]; then continue; fi ;;
              Cargo.toml | Cargo.lock)
                if [ "$status" = M ] && version_lines_only "$path"; then
                  [ "$path" = Cargo.toml ] && cargo_toml=true
                  [ "$path" = Cargo.lock ] && cargo_lock=true
                  continue
                fi ;;
            esac
            decide true "$path is not docs or a version bump"
          done <<< "$files"
          # A requirement change that leaves the lock untouched is not a version bump.
          [ "$cargo_toml" = "$cargo_lock" ] || decide true "Cargo.toml and Cargo.lock must change together"
          decide false "only docs or version lines changed"

  setup:
    needs: [schedule-gate, changes]
    if: needs.schedule-gate.outputs.proceed == 'true' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-16c-64gb
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Distribute tests across shards
        id: shard
        working-directory: e2e/
        run: |
          set -euo pipefail
          # Only files with exactly the e2e build tag (not compound tags like "e2e && stress").
          grep -l '^//go:build e2e$' ./*_test.go \
            | xargs grep -h '^func TestE2E_' \
            | sed 's/func \(TestE2E_[a-zA-Z0-9_]*\).*/\1/' \
            | sort -u > "$RUNNER_TEMP/tests.txt"
          python3 - shard-durations.txt "$RUNNER_TEMP/tests.txt" "$SHARD_COUNT" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re, statistics, sys
          durations_path, tests_path, count = sys.argv[1], sys.argv[2], int(sys.argv[3])
          known = {}
          for line in open(durations_path):
              line = line.split("#", 1)[0].strip()
              if line:
                  name, secs = line.split()
                  known[name] = float(secs)
          tests = [t.strip() for t in open(tests_path) if t.strip()]
          bad = [t for t in tests if not re.fullmatch(r"TestE2E_[A-Za-z0-9_]+", t)]
          if not tests or bad:
              sys.exit(f"no tests found or bad test names: {bad}")
          median = statistics.median(known.values())
          shards = [{"load": 0.0, "tests": []} for _ in range(count)]
          for t in sorted(tests, key=lambda t: (-known.get(t, median), t)):
              s = min(shards, key=lambda s: s["load"])
              s["load"] += known.get(t, median)
              s["tests"].append(t)
          # An empty RUN would run every test, so an empty shard is an error.
          if any(not s["tests"] for s in shards):
              sys.exit("a shard has no tests")
          for i, s in enumerate(shards, 1):
              print(f"shard {i}: {len(s['tests'])} tests, {s['load']:.0f} slot-seconds", file=sys.stderr)
          for t in tests:
              if t not in known:
                  print(f"::notice::{t} is not in shard-durations.txt; it counts as {median:.0f}s", file=sys.stderr)
          matrix = [{"shard": i, "run": "^(" + "|".join(sorted(s["tests"])) + ")$"} for i, s in enumerate(shards, 1)]
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          EOF
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build images
        working-directory: e2e/
        env:
          DZ_E2E_SKIP_DEVICE_BUILD: "1"
        run: go run ./cmd/dzctl/main.go build
      # cEOS is licensed, so the device image never goes into an artifact. The
      # shards build it, and they do not need the base image.
      - name: Save images
        run: |
          set -euo pipefail
          docker save "$DZ_LEDGER_IMAGE" "$DZ_CONTROLLER_IMAGE" "$DZ_MANAGER_IMAGE" "$DZ_FUNDER_IMAGE" \
            "$DZ_CLIENT_IMAGE" "$DZ_DEVICE_HEALTH_ORACLE_IMAGE" "$DZ_GEOPROBE_IMAGE" "$DZ_SENTINEL_IMAGE" \
            "$DZ_IP_VERIFIER_IMAGE" "$DZ_VALIDATOR_METADATA_SERVICE_MOCK_IMAGE" \
            | zstd -T0 -3 -o "$RUNNER_TEMP/images.tar.zst"
          ls -lh "$RUNNER_TEMP/images.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e:
    name: e2e (shard ${{ matrix.shard }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-24.04-16c-64gb
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images
      - name: Load images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/images/images.tar.zst" | docker load
          rm -rf "$RUNNER_TEMP/images"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          pull() {
            for delay in 10 30; do
              docker pull "$1" && return 0
              sleep "$delay"
            done
            docker pull "$1"
          }
          pull "$DZ_PROMETHEUS_IMAGE"
          pull "$DZ_INFLUXDB_IMAGE"
      # BuildKit resolves the cEOS base on the registry even after a pull, so the
      # login lasts for the build. The build runs no PR code on the host.
      - name: Build device image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build -t "$DZ_DEVICE_IMAGE" -f e2e/docker/device/Dockerfile --platform linux/amd64 \
            --build-arg "ARISTA_CEOS_IMAGE=$ARISTA_CEOS_IMAGE" --build-arg DOCKERFILE_DIR=e2e/docker/device .
      - name: test
        env:
          DZ_E2E_NO_BUILD: "1"
          # TestE2E_BackwardCompatibility lists client releases through the GitHub
          # API. Unauthenticated, the limit is 60 requests an hour per address.
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ matrix.run }}
        run: make e2e-test RUN="$RUN" PARALLEL=6 TIMEOUT=30m
      - name: Report peak memory
        if: always()
        run: |
          # Docker runs its containers under system.slice.
          peak=/sys/fs/cgroup/system.slice/memory.peak
          if [ -r "$peak" ]; then
            msg="Peak memory of system.slice: $(awk '{printf "%.1f GB", $1 / 1e9}' "$peak")"
          else
            msg="Peak memory: $peak is not readable"
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  e2e-ok:
    # The one check to require on main, so skipped shards never leave it unreported.
    name: e2e-ok
    if: always()
    needs: [schedule-gate, changes, setup, e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
