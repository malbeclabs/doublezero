[workspace]
members = [
    "client/doublezero",
    "config",
    "smartcontract/cli",
    "smartcontract/sdk/rs",
    "smartcontract/programs/doublezero-record",
    "smartcontract/programs/doublezero-serviceability",
    "smartcontract/programs/doublezero-telemetry",
    "smartcontract/programs/doublezero-geolocation",
    "smartcontract/programs/common",
    "e2e/docker/ledger/fork-accounts",
    "crates/doublezero-cli-core",
    "crates/doublezero-serviceability-instruction",
    "crates/doublezero-daemon-cli",
    "crates/doublezero-geolocation-cli",
    "crates/doublezero-ip-proof",
    "crates/doublezero-ip-verifier",
    "crates/sentinel",
    # from doublezero-offchain
    "offchain/crates/contributor-rewards",
    "offchain/crates/passport-cli",
    "offchain/crates/scheduled-command",
    "offchain/crates/sentinel",
    "offchain/crates/slack-notifier",
    "offchain/crates/solana-admin-cli/passport",
    "offchain/crates/solana-admin-cli/revenue-distribution",
    "offchain/crates/solana-admin-cli/sol-conversion",
    "offchain/crates/solana-cli",
    "offchain/crates/solana-client-tools",
    "offchain/crates/solana-fork",
    "offchain/crates/solana-interface/sol-conversion",
    "offchain/crates/solana-sdk",
    "offchain/crates/validator-debt",
    "offchain/scheduler/native/scheduler_doublezero",
]
default-members = []
exclude = [
    # The Solana L1 programs keep their own workspace, lockfile and toolchain.
    # 62 of the 96 crates in their build closure resolve to a different version
    # under this workspace's lockfile, which would change the compiled bytes and
    # break `solana/programs/sha256sums_*.txt`.
    "solana",
    # Not a member in doublezero-offchain either.
    "offchain/programs/mock-shred-subscription-program",
    "sdk/revdist/testdata/fixtures/generate-fixtures",
    "sdk/serviceability/testdata/fixtures/generate-fixtures",
    "sdk/telemetry/testdata/fixtures/generate-fixtures",
    "sdk/geolocation/testdata/fixtures/generate-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.38.0"
authors = ["Malbec Labs <dev@malbeclabs.com>"]
readme = "README.md"
edition = "2021"
description = "Malbec Labs DoubleZero"
homepage = "https://github.com/malbeclabs/doublezero"
license = "Apache-2.0"
repository = "https://github.com/malbeclabs/doublezero"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
axum = { version = "0", default-features = false }
backon = "1"
# NOTE: We need to maintain base64 version 0.22.1
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bitvec = "1"
borsh = { version = "1", features = ["derive"] }
borsh-incremental = { version = "0" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
byteorder = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
console = "0"
ctor = "1"
directories-next = "2"
dirs-next = "2"
env_logger = "0"
eyre = "0.6"
futures = "0.3"
futures-util = "0"
hex = "0.4"
http = "1"
http-body-util = "0"
hyper = "1"
hyper-util = "0"
hyperlocal = { version = "0" }
indexmap = { version = "2", features = ["serde"] }
indicatif = "0"
ipnetwork = "0"
libc = "0.2"
log = "0"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
metrics-util = "0"
mockall = "0.15"
reqwest = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0"
serde_json = "1"
serde_yaml = "0"
serial_test = "3"
solana-account-decoder = "4.1"
solana-client = "3.0"
solana-bincode = "3.0"
solana-commitment-config = "3.0"
solana-compute-budget-interface = "3.0"
solana-ed25519-program = "3.0"
solana-instruction = "3.4"
solana-instructions-sysvar = "3.0"
solana-keypair = "3.1"
solana-loader-v3-interface = { version = "6", features = ["serde"] }
solana-program = "3.0"
solana-program-test = "=3.0.12"
solana-pubsub-client = "3.0"
solana-rpc-client-api = "3.0"
solana-sdk = "=3.0"
solana-sdk-ids = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction-status = "3.0"
bitflags = "2"
tabled = { version = "0.20", features = ["std", "derive"] }
temp-env = "0"
tempfile = "3"
thiserror = "2"
tokio-util = "0.7"
tower = "0"
tower-http = { version = "0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true, features = ["env-filter", "fmt", "registry"] }
url = "2"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
arrow = "57"
aws-config = "1"
aws-sdk-s3 = "1"
bs58 = "0.5"
config = "0.15"
csv = "1"
dotenvy = "0.15"
governor = "0.6"
home = "0.5"
humantime = "2"
itertools = "0.14"
leaky-bucket = "1"
md5 = "0.8"
parquet = { version = "57", features = ["async"] }
percent-encoding = "2"
rayon = "1"
retainer = "0.4"
rust_decimal = { version = "1", features = ["serde", "macros"] }
solana-account-decoder-client-types = "3.0"
solana-address-lookup-table-interface = { version = "3", features = ["bincode", "bytemuck"] }
solana-message = { version = "3.0", features = ["bincode"] }
solana-offchain-message = { version = "3.0", features = ["verify"] }
solana-program-pack = "3.0"
solana-pubkey = { version = "3.0", features = ["borsh", "bytemuck"] }
solana-reward-info = "3.0"
solana-rpc-client-types = "3.0"
solana-sanitize = "3.0"
solana-transaction-status-client-types = "3.0"
spl-associated-token-account-interface = "2"
spl-memo-interface = "2"
spl-token-interface = "2"
svm-hash = { version = "0.2", features = ["bytemuck", "borsh"] }
tokio-cron-scheduler = "0.14"

doublezero-cli-core = { path = "crates/doublezero-cli-core" }
doublezero-config = { path = "config" }
doublezero-daemon-cli = { path = "crates/doublezero-daemon-cli" }
doublezero-geolocation-cli = { path = "crates/doublezero-geolocation-cli" }
doublezero-ip-proof = { path = "crates/doublezero-ip-proof" }
doublezero-ip-verifier = { path = "crates/doublezero-ip-verifier" }
# default-features = false MUST be set here, not on the consumer edge: an inheriting
# member's `default-features = false` is ignored unless the workspace dep declares it.
# This keeps sentinel's server-only deps (Prometheus exporter → rustls/aws-lc-sys) out of
# the `doublezero` CLI.
doublezero-sentinel = { path = "crates/sentinel", default-features = false }
doublezero-serviceability-cli = { path = "smartcontract/cli" }
doublezero-serviceability-instruction = { path = "crates/doublezero-serviceability-instruction" }
doublezero-program-common = { path = "smartcontract/programs/common" }
doublezero_sdk = { path = "smartcontract/sdk/rs" }

[workspace.dependencies.doublezero-record]
path = "smartcontract/programs/doublezero-record"
features = ["no-entrypoint"]

[workspace.dependencies.doublezero-serviceability]
path = "smartcontract/programs/doublezero-serviceability"
features = ["no-entrypoint", "serde"]

[workspace.dependencies.doublezero-telemetry]
path = "smartcontract/programs/doublezero-telemetry"
features = ["no-entrypoint", "serde"]

[workspace.dependencies.doublezero-geolocation]
path = "smartcontract/programs/doublezero-geolocation"
features = ["no-entrypoint"]

### The offchain crates

[workspace.dependencies.doublezero-contributor-rewards]
path = "offchain/crates/contributor-rewards"

[workspace.dependencies.doublezero-ledger-sentinel]
path = "offchain/crates/sentinel"

[workspace.dependencies.doublezero-passport-cli]
path = "offchain/crates/passport-cli"

[workspace.dependencies.doublezero-scheduled-command]
path = "offchain/crates/scheduled-command"

[workspace.dependencies.doublezero-sol-conversion-interface]
path = "offchain/crates/solana-interface/sol-conversion"
features = ["serde"]

[workspace.dependencies.doublezero-solana-client-tools]
path = "offchain/crates/solana-client-tools"

[workspace.dependencies.doublezero-solana-sdk]
path = "offchain/crates/solana-sdk"

[workspace.dependencies.doublezero-solana-validator-debt]
path = "offchain/crates/validator-debt"

[workspace.dependencies.slack-notifier]
path = "offchain/crates/slack-notifier"

### The Solana L1 programs, which keep their own workspace and lockfile per D2 of
### docs/superpowers/specs/2026-08-27-monorepo-migration-design.md. A path
### dependency may point into an excluded tree, so these three compile once per
### lockfile, exactly as they did when the trees were separate repositories.

[workspace.dependencies.doublezero-passport]
path = "solana/programs/passport"
features = ["offchain"]

[workspace.dependencies.doublezero-program-tools]
path = "solana/crates/program-tools"

[workspace.dependencies.doublezero-revenue-distribution]
path = "solana/programs/revenue-distribution"

### Outside this repository

[workspace.dependencies.network-shapley]
features = ["serde", "borsh"]
git = "https://github.com/doublezerofoundation/network-shapley-rs"
tag = "v0.6.0"
