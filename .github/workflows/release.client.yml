name: releaser.client

on:
  push:
    tags:
      - "client/v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-gnu/release
            target/mainnet-beta
            target/mainnet-beta/x86_64-unknown-linux-gnu/release
      - name: Set env vars
        run: ./scripts/env.sh >> $GITHUB_ENV
      - name: Install rust for cli
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install dependencies for rpm packaging and musl static build
        run: |
          sudo apt update
          sudo apt-get install squashfs-tools rpm musl-tools -y
      # With cosign on PATH, goreleaser-action checks the signature as well as the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: build client release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: v2.18.2
          args: release -f release/.goreleaser.testnet.client.yaml --clean
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BOTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
