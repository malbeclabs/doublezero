name: release pipeline validation

on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  # Validates every GoReleaser config, including the Pro-only keys, without a
  # license key, so it runs on pull requests with no secret.
  validate_pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [agent, client, controller, device-telemetry-agent, funder, monitor, qa-agent, s3-uploader, global-monitor]
    name: release-validation-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-goreleaser-pro
      - name: Check GoReleaser config
        run: goreleaser check -f release/.goreleaser.base.${{ matrix.release }}.yaml

  # Builds the full snapshot, which needs the GoReleaser Pro key. The key sits in
  # Secrets Manager in dz-ci behind a role that trusts only this workflow on main,
  # so the job runs only there, and only once the role exists and
  # GORELEASER_ROLE_ARN is set (malbeclabs/infra#3205). A snapshot neither
  # publishes nor announces, so it gets no other secret.
  release_snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GORELEASER_ROLE_ARN != ''
    runs-on: ubuntu-24.04-16c-64gb
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - release: agent
            languages: ["go"]
          - release: client
            languages: ["go", "rust"]
          - release: controller
            languages: ["go"]
          - release: device-telemetry-agent
            languages: ["go"]
          - release: funder
            languages: ["go"]
          - release: monitor
            languages: ["go"]
          - release: qa-agent
            languages: ["go"]
          - release: s3-uploader
            languages: ["go"]
          - release: global-monitor
            languages: ["go"]
    name: release-snapshot-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
        if: contains(matrix.languages, 'go')

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: contains(matrix.languages, 'rust')
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-gnu/release

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Add 1.99.1 patch release (master, 2026-10-16)
        if: contains(matrix.languages, 'rust')
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-musl

      - name: Install dependencies for rpm packaging
        run: |
          sudo apt update
          sudo apt-get install build-essential pkg-config libssl-dev squashfs-tools rpm musl-tools -y

      - name: Set env vars
        run: ./scripts/env.sh >> $GITHUB_ENV

      - uses: ./.github/actions/install-goreleaser-pro

      - name: Read the AWS region from the secret ARN
        id: region
        env:
          GORELEASER_SECRET_ARN: ${{ vars.GORELEASER_SECRET_ARN }}
        run: |
          echo "region=$(cut -d: -f4 <<<"$GORELEASER_SECRET_ARN")" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GORELEASER_ROLE_ARN }}
          aws-region: ${{ steps.region.outputs.region }}

      # Fetched in the step that uses it, so the key never reaches GITHUB_ENV or
      # another step.
      - name: Run GoReleaser
        env:
          GORELEASER_SECRET_ARN: ${{ vars.GORELEASER_SECRET_ARN }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          GORELEASER_KEY=$(aws secretsmanager get-secret-value --secret-id "$GORELEASER_SECRET_ARN" --query SecretString --output text)
          echo "::add-mask::$GORELEASER_KEY"
          export GORELEASER_KEY
          goreleaser release --snapshot -f "release/.goreleaser.base.${RELEASE}.yaml" --clean
