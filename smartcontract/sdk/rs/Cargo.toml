[package]
name = "doublezero_sdk"

# Workspace inherited keys
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "doublezero_sdk"

[dependencies]
async-trait.workspace = true
backon.workspace = true
base64.workspace = true
borsh.workspace = true
bytemuck.workspace = true
bincode.workspace = true
chrono.workspace = true
directories-next.workspace = true
dirs-next.workspace = true
doublezero-cli-core = { workspace = true, optional = true }
doublezero-config.workspace = true
doublezero-geolocation = { workspace = true, features = ["no-entrypoint"] }
# RFC-27 proof struct carried by the user-creation commands. `signer` for the verification
# half only: the SDK never issues a proof, but it checks the one it was handed against the
# onchain verifier key before paying for a transaction the precompile would reject. Safe for
# the BPF build — `cargo build-sbf` does not pull this crate into the program's graph.
doublezero-ip-proof = { workspace = true, features = ["signer"] }
doublezero-program-common.workspace = true
doublezero-record.workspace = true
doublezero-serviceability.workspace = true
doublezero-serviceability-instruction.workspace = true
doublezero-telemetry = { workspace = true, features = ["no-entrypoint", "serde"] }
eyre.workspace = true
futures.workspace = true
mockall.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serial_test.workspace = true
solana-account-decoder.workspace = true
solana-client.workspace = true
solana-commitment-config.workspace = true
solana-compute-budget-interface.workspace = true
solana-loader-v3-interface.workspace = true
solana-program.workspace = true
solana-pubsub-client.workspace = true
solana-rpc-client-api.workspace = true
solana-sdk.workspace = true
solana-transaction-status.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
solana-system-interface.workspace = true
log.workspace = true

[features]
default-mainnet-beta = []
# Enables `from_context` constructors that build clients directly from a
# resolved `CliContext`. Gated so non-CLI SDK consumers don't pull in the
# CLI-only dependency tree (clap, tabled, tracing-subscriber).
cli-context = ["dep:doublezero-cli-core"]
