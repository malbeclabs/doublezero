# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "skip-changelog"
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
      go-testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/golang/mock"
          - "go.uber.org/mock"

  - package-ecosystem: "cargo"
    # Enumerated rather than "**/*" because that glob would also pick up
    # solana/Cargo.toml, and no job in this repo builds that tree: it keeps its
    # own lockfile so the programs stay reproducible against
    # solana/programs/sha256sums_*.txt. A grouped update would edit that lockfile,
    # merge green with nothing compiled, and change the bytes the checksums pin.
    # The offchain crates need no entry of their own any more, because they are
    # root workspace members and "/" covers them.
    directories:
      - "/"
      - "/sdk/geolocation/testdata/fixtures/generate-fixtures"
      - "/sdk/revdist/testdata/fixtures/generate-fixtures"
      - "/sdk/serviceability/testdata/fixtures/generate-fixtures"
      - "/sdk/telemetry/testdata/fixtures/generate-fixtures"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "skip-changelog"
      - "dependencies"
      - "rust"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
      solana:
        patterns:
          - "solana-*"
          - "spl-*"
      anchor:
        patterns:
          - "anchor-*"
      tokio:
        patterns:
          - "tokio*"
      serde:
        patterns:
          - "serde*"

  - package-ecosystem: "github-actions"
    directories:
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "skip-changelog"
      - "dependencies"
      - "ci"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        update-types:
          - "major"
