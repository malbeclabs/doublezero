[package]
name = "doublezero-solana-client-tools"
edition = "2024"
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
version = "0.0.1"

[features]
default = ["squads"]
squads = [
    "dep:bs58",
    "dep:percent-encoding",
    "dep:solana-loader-v3-interface",
    "dep:solana-message",
]

[dependencies]
anyhow.workspace = true
# bincode 1, not the workspace entry: this repo's own crates are on bincode 2,
# whose API (bincode::serde::encode_to_vec) is a different one. Unifying is a
# code change, not a manifest change.
bincode = "1"
borsh.workspace = true
bs58 = { workspace = true, optional = true }
bytemuck.workspace = true
clap.workspace = true
doublezero-program-tools.workspace = true
doublezero_sdk.workspace = true
home.workspace = true
percent-encoding = { workspace = true, optional = true }
serde_json.workspace = true
solana-address-lookup-table-interface.workspace = true
solana-client.workspace = true
solana-commitment-config.workspace = true
solana-compute-budget-interface.workspace = true
solana-loader-v3-interface = { workspace = true, optional = true }
solana-message = { workspace = true, optional = true }
solana-sdk.workspace = true
solana-transaction-status-client-types.workspace = true
spl-associated-token-account-interface.workspace = true
spl-memo-interface.workspace = true
spl-token-interface.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
leaky-bucket.workspace = true
solana-program-test.workspace = true
solana-reward-info.workspace = true
solana-rpc-client-types.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true