name: releaser.doublezero.monitor.tool

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout doublezero_monitor repo
        uses: actions/checkout@v4
        with:
          repository: alexpyattaev/doublezero_monitor
          path: doublezero_monitor
      - name: install dependencies for rpm packaging
        run: |
          sudo apt update
          sudo apt-get install squashfs-tools rpm -y
      - name: Authenticate to Cloudsmith (OIDC)
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
        with:
          oidc-namespace: malbeclabs
          oidc-service-slug: github-actions-publish
          export-auth-token: "true"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release -f release/.goreleaser.devnet.doublezero.monitor.tool.yaml --clean
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BOTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CLOUDSMITH_TOKEN: ${{ env.CLOUDSMITH_API_KEY }}
