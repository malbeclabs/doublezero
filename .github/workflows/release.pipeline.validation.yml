name: release pipeline validation

on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  # GoReleaser Pro skips its license check in snapshot mode, so the full build
  # runs with no GORELEASER_KEY and no other secret. A snapshot neither publishes
  # nor announces.
  validate_pipeline:
    runs-on: ubuntu-24.04-16c-64gb
    strategy:
      matrix:
        include:
          - release: agent
            languages: ["go"]
          - release: client
            languages: ["go", "rust"]
          - release: controller
            languages: ["go"]
          - release: device-telemetry-agent
            languages: ["go"]
          - release: funder
            languages: ["go"]
          - release: monitor
            languages: ["go"]
          - release: qa-agent
            languages: ["go"]
          - release: s3-uploader
            languages: ["go"]
          - release: global-monitor
            languages: ["go"]
    name: release-validation-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
        if: contains(matrix.languages, 'go')

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: contains(matrix.languages, 'rust')
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-gnu/release

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Add 1.99.1 patch release (master, 2026-10-16)
        if: contains(matrix.languages, 'rust')
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-musl

      - name: Install dependencies for rpm packaging
        run: |
          sudo apt update
          sudo apt-get install build-essential pkg-config libssl-dev squashfs-tools rpm musl-tools -y

      - name: Set env vars
        run: ./scripts/env.sh >> $GITHUB_ENV

      - uses: ./.github/actions/install-goreleaser-pro
      - name: Run GoReleaser
        run: goreleaser release --snapshot -f release/.goreleaser.base.${{ matrix.release }}.yaml --clean
