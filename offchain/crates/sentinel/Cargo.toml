[package]
name = "doublezero-ledger-sentinel"
description = "Sentinel for access to DoubleZero Ledger Network"
version = "0.2.5"

edition = "2024"
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
# bincode 1, not the workspace entry: this repo's own crates are on bincode 2,
# whose API (bincode::serde::encode_to_vec) is a different one. Unifying is a
# code change, not a manifest change.
bincode = "1"
borsh.workspace = true
clap.workspace = true
config.workspace = true
doublezero-passport.workspace = true
doublezero-program-common.workspace = true
doublezero-program-tools.workspace = true
doublezero-record.workspace = true
doublezero-revenue-distribution.workspace = true
doublezero-serviceability.workspace = true
doublezero_sdk.workspace = true
backon.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mockall.workspace = true
retainer.workspace = true
# Direct dependency so the workspace TLS root features (rustls-tls-native-roots)
# unify into this binary; sentinel otherwise reaches reqwest only through
# solana-client, which enables webpki roots alone.
# reqwest 0.12 with rustls and the OS root store, not the workspace entry: this
# repo's own crates are on 0.13 with the default native TLS backend, and
# switching either side's TLS stack is not a manifest change.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
solana-account-decoder-client-types.workspace = true
solana-client.workspace = true
solana-commitment-config.workspace = true
solana-compute-budget-interface.workspace = true
solana-sanitize.workspace = true
solana-sdk.workspace = true
solana-transaction-status-client-types.workspace = true
solana-system-interface.workspace = true
spl-associated-token-account-interface.workspace = true
spl-token-interface.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[bin]]
name = "doublezero-sentinel"
path = "src/main.rs"
