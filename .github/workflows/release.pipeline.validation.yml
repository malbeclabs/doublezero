name: release pipeline validation

on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: write

jobs:
  validate_pipeline:
    runs-on: doublezero-k8s-ci
    strategy:
      matrix:
        include:
          - release: agent
            languages: ["go"]
          - release: client
            languages: ["go", "rust"]
          - release: controller
            languages: ["go"]
          - release: device-telemetry-agent
            languages: ["go"]
          - release: funder
            languages: ["go"]
          - release: monitor
            languages: ["go"]
          - release: qa-agent
            languages: ["go"]
          - release: s3-uploader
            languages: ["go"]
          - release: global-monitor
            languages: ["go"]
    name: release-validation-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
        if: contains(matrix.languages, 'go')

      - uses: Swatinem/rust-cache@v2
        if: contains(matrix.languages, 'rust')
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-gnu/release

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        if: contains(matrix.languages, 'rust')
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install dependencies for rpm packaging
        run: |
          sudo apt update
          sudo apt-get install build-essential pkg-config libssl-dev squashfs-tools rpm musl-tools -y

      - name: Set env vars
        run: ./scripts/env.sh >> $GITHUB_ENV

      # With cosign on PATH, goreleaser-action checks the signature as well as the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: v2.18.2
          args: release --snapshot -f release/.goreleaser.base.${{ matrix.release }}.yaml --clean
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BOTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
