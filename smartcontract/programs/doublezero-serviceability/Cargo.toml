[package]
name = "doublezero-serviceability"

# clippy ignores rust-version.toml
rust-version = "1.84.1" # cargo build-sbf --version

# Workspace inherited keys
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh.workspace = true
borsh-incremental.workspace = true
bytemuck.workspace = true
doublezero-ip-proof.workspace = true
doublezero-program-common.workspace = true
ipnetwork.workspace = true
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
solana-program.workspace = true
solana-system-interface.workspace = true
thiserror.workspace = true
bitflags.workspace = true

[dev-dependencies]
# RFC-26 R10 safety net: build instructions via the pure builder crate and run them
# against the real program to catch account-order drift. Dev-dep only — the cycle
# (serviceability --[dev]--> instruction-builder --> serviceability) is allowed by cargo.
doublezero-serviceability-instruction.workspace = true
# `signer` builds the Ed25519 instruction's signature in tests. Dev-only — `cargo build-sbf`
# builds no dev targets, so no userspace Ed25519 implementation reaches the cdylib.
doublezero-ip-proof = { workspace = true, features = ["signer"] }
# Builds Instructions-sysvar buffers with the runtime's own serializer, so the scan is tested
# against the real encoding rather than a hand-rolled imitation of it. The program reads that
# buffer directly (see `ip_proof::instruction_at`) and needs nothing from this crate at runtime.
solana-instruction.workspace = true
solana-instructions-sysvar.workspace = true
solana-ed25519-program.workspace = true
solana-keypair.workspace = true
solana-compute-budget-interface.workspace = true
solana-sdk.workspace = true
solana-sdk-ids.workspace = true
solana-system-interface.workspace = true
solana-program-test.workspace = true
base64.workspace = true
strum = { workspace = true }
strum_macros = { workspace = true }
ctor.workspace = true
env_logger.workspace = true
log.workspace = true

[features]
default = []
no-entrypoint = []
serde = ["dep:serde", "dep:serde_bytes"]
