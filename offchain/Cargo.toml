[workspace]
exclude = ["programs/mock-shred-subscription-program"]
members = [
    "crates/contributor-rewards",
    "crates/scheduled-command",
    "crates/sentinel",
    "crates/slack-notifier",
    "crates/solana-interface/sol-conversion",
    "crates/solana-admin-cli/passport",
    "crates/solana-admin-cli/revenue-distribution",
    "crates/solana-admin-cli/sol-conversion",
    "crates/passport-cli",
    "crates/solana-cli",
    "crates/solana-client-tools",
    "crates/solana-fork",
    "crates/solana-sdk",
    "crates/validator-debt",
    "scheduler/native/scheduler_doublezero"
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Malbec Labs <dev@malbeclabs.com>"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/doublezerofoundation/doublezero-offchain"
homepage = "https://github.com/doublezerofoundation/doublezero-offchain"

[workspace.dependencies]
anyhow = "1"
arrow = "57"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
backon = "1"
base64 = "0.22"
bincode = "1"
bitvec = "1"
md5 = "0.8"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
csv = "1"
dotenvy = "0.15"
eyre = "0.6"
futures = "0.3"
governor = "0.6"
hex = "0.4"
home = "0.5"
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.14"
libc = "0.2"
leaky-bucket = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
mockall = "0.13"
parquet = { version = "57", features = [ "async" ] }
percent-encoding = "2"
rayon = "1"
# rustls-tls bundles the webpki Mozilla roots; rustls-tls-native-roots adds the
# host OS certificate store so OS-installed private CAs stay trusted.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
retainer = "0.4"
rust_decimal = { version = "1", features = ["serde", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder = "3.0"
solana-account-decoder-client-types = "3.0"
solana-address-lookup-table-interface = { version = "3", features = ["bincode", "bytemuck"] }
solana-client = "3.0"
solana-commitment-config = "3.0"
solana-compute-budget-interface = "3.0"
solana-instruction = "3.0"
solana-message = { version = "3.0", features = ["bincode"] }
solana-pubkey = { version = "3.0", features = ["borsh", "bytemuck"] }
solana-reward-info = "3.0"
solana-rpc-client-types = "3.0"
solana-sanitize = "3.0"
# Held to the 3.0 minor: later 3.x releases of the meta-crate remove more
# deprecated re-exports (sysvar, account, message, ...) that this workspace
# still consumes.
solana-sdk = "=3.0"
solana-sdk-ids = "3.0"
solana-system-interface = ">=1,<=3"
solana-transaction-status-client-types = "3.0"
spl-associated-token-account-interface = ">=1,<=2"
spl-memo-interface = ">=1,<=2"
spl-token-interface = ">=1,<=2"
solana-loader-v3-interface = ">=5,<=6"
solana-offchain-message = { version = "3.0", features = ["verify"] }
solana-program-pack = "3.0"
solana-program-test = "=3.0.12"
strum = { version = "0.27", features = ["derive"] }
svm-hash = { version = "0.2", features = ["bytemuck", "borsh"] }
tabled = { version = "0.20", features = ["std", "derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
tokio-cron-scheduler = "0.14"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true, features = ["env-filter", "fmt", "registry"] }
url = "2"

### Dependencies found in github.com/doublezerofoundation/doublezero-solana

[workspace.dependencies.doublezero-passport]
features = ["offchain"]
git = "https://github.com/doublezerofoundation/doublezero-solana"
tag = "revenue-distribution/v0.3.7"

[workspace.dependencies.doublezero-program-tools]
git = "https://github.com/doublezerofoundation/doublezero-solana"
tag = "revenue-distribution/v0.3.7"

[workspace.dependencies.doublezero-revenue-distribution]
git = "https://github.com/doublezerofoundation/doublezero-solana"
tag = "revenue-distribution/v0.3.7"

### Dependencies found in github.com/malbeclabs/doublezero

# RFC-20 CLI core: provides CliContext, OutputFormat, RequirementCheck, the
# render_* output helpers, and the eyre-based error type. The whole SDK family
# is pinned to a single monorepo revision so shared types unify across the
# boundary. client/v0.31.0 is the first released client tag on the Solana 3.0
# line (past #3830) and carries the EdgeSeat FeedSeat schema (#3954/#4030)
# deployed on testnet, replacing the interim #4030 merge-commit pin.
[workspace.dependencies.doublezero-cli-core]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

# Source of the RFC-20 `Environment` enum consumed by `CliContext`. MUST be
# pinned to the same revision as doublezero-cli-core so the `Environment` type
# unifies across the boundary.
[workspace.dependencies.doublezero-config]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

[workspace.dependencies.doublezero-program-common]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

[workspace.dependencies.doublezero-record]
features = ["no-entrypoint"]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

[workspace.dependencies.doublezero_sdk]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

[workspace.dependencies.doublezero-serviceability]
features = ["no-entrypoint", "serde"]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

[workspace.dependencies.doublezero-telemetry]
features = ["no-entrypoint", "serde"]
git = "https://github.com/malbeclabs/doublezero"
tag = "client/v0.31.0"

### Other git dependencies

[workspace.dependencies.network-shapley]
features = ["serde", "borsh"]
git = "https://github.com/doublezerofoundation/network-shapley-rs"
tag = "v0.6.0"

### Local dependencies

[workspace.dependencies.doublezero-contributor-rewards]
path = "crates/contributor-rewards"

[workspace.dependencies.doublezero-scheduled-command]
path = "crates/scheduled-command"

[workspace.dependencies.doublezero-ledger-sentinel]
path = "crates/sentinel"

[workspace.dependencies.doublezero-passport-cli]
path = "crates/passport-cli"

[workspace.dependencies.doublezero-sol-conversion-interface]
features = ["serde"]
path = "crates/solana-interface/sol-conversion"

[workspace.dependencies.doublezero-solana-client-tools]
path = "crates/solana-client-tools"

[workspace.dependencies.doublezero-solana-sdk]
path = "crates/solana-sdk"

[workspace.dependencies.doublezero-solana-validator-debt]
path = "crates/validator-debt"

[workspace.dependencies.slack-notifier]
path = "crates/slack-notifier"

[profile.release]
lto = true
codegen-units = 1
