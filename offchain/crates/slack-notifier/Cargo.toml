[package]
name = "slack-notifier"
version = "0.0.1"

# Workspace inherited keys
edition = "2024"
authors.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
backon.workspace = true
chrono.workspace = true
# reqwest 0.12 with rustls and the OS root store, not the workspace entry: this
# repo's own crates are on 0.13 with the default native TLS backend, and
# switching either side's TLS stack is not a manifest change.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tabled.workspace = true
tokio.workspace = true
