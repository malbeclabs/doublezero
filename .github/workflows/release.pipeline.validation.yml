name: release pipeline validation

on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  # Validates each GoReleaser config with `goreleaser check`, which needs no license
  # key, so no run reads a secret. The full Pro snapshot comes back on `main` only,
  # with GORELEASER_KEY from Secrets Manager, once its role exists
  # (malbeclabs/infra#3034).
  validate_pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release:
          - agent
          - client
          - controller
          - device-telemetry-agent
          - funder
          - monitor
          - qa-agent
          - s3-uploader
          - global-monitor
    name: release-validation-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-goreleaser-pro
      - name: Check GoReleaser config
        env:
          RELEASE: ${{ matrix.release }}
        run: goreleaser check -f "release/.goreleaser.base.${RELEASE}.yaml"
