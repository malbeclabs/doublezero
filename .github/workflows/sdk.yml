name: sdk
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  sdk-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Python and TypeScript versions match
        run: |
          check_versions() {
            local sdk=$1
            local py_ver ts_ver
            py_ver=$(python3 -c "import tomllib; print(tomllib.load(open('sdk/$sdk/python/pyproject.toml','rb'))['project']['version'])")
            ts_ver=$(node -p "require('./sdk/$sdk/typescript/package.json').version")
            if [ "$py_ver" != "$ts_ver" ]; then
              echo "❌ $sdk: Python=$py_ver TypeScript=$ts_ver"
              return 1
            fi
            echo "✓ $sdk: $py_ver"
          }

          failed=0
          for sdk in borsh-incremental serviceability telemetry revdist; do
            check_versions "$sdk" || failed=1
          done

          if [ $failed -eq 1 ]; then
            echo ""
            echo "Version mismatch detected. Python and TypeScript versions must match."
            exit 1
          fi

  sdk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make sdk-test

  # Committed .bin/.json goldens must match Rust Borsh output. Regenerating every
  # sdk-test run would move producer and expected bytes together and mask drift;
  # this Rust-enabled job regenerates then fails on any fixture diff.
  sdk-fixture-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Add 1.99.1 patch release (master, 2026-10-16)
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check fixture drift
        run: make check-fixtures

  sdk-compat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make sdk-compat-test
        env:
          REVDIST_COMPAT_TEST: "1"
