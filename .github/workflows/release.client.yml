name: releaser.client

on:
  push:
    tags:
      - "client/v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-gnu/release
            target/mainnet-beta
            target/mainnet-beta/x86_64-unknown-linux-gnu/release
      - name: Set env vars
        run: ./scripts/env.sh >> $GITHUB_ENV
      - name: Install rust for cli
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install dependencies for rpm packaging and musl static build
        run: |
          sudo apt update
          sudo apt-get install squashfs-tools rpm musl-tools -y
      # aarch64-unknown-linux-musl cross-compilation (see doublezero-cli-arm64 in
      # release/.goreleaser.base.client.yaml for why cargo-zigbuild is needed here instead of a
      # musl-gcc cross toolchain).
      - name: Install zig for aarch64 musl cross-compilation
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          sudo tar -xf /tmp/zig.tar.xz -C /usr/local
          sudo ln -sf /usr/local/zig-x86_64-linux-0.16.0/zig /usr/local/bin/zig
          zig version
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: build client release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release -f release/.goreleaser.testnet.client.yaml --clean
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BOTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
