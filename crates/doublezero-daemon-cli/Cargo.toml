[package]
name = "doublezero-daemon-cli"

# Workspace inherited keys
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "doublezero_daemon_cli"

[dependencies]
backon.workspace = true
chrono.workspace = true
clap.workspace = true
eyre.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyperlocal.workspace = true
indicatif.workspace = true
mockall.workspace = true
# The RFC-27 proof retrieved from the verification service and forwarded to the SDK.
doublezero-ip-proof.workspace = true
# One short blocking HTTP request per `connect`, to the IP verification service. `local_address`
# is what lets a multi-homed host prove the address its tunnel will actually use.
reqwest = { workspace = true, features = ["json", "blocking"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-sdk.workspace = true
tabled.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

doublezero-cli-core.workspace = true
doublezero-config.workspace = true
doublezero-serviceability.workspace = true
doublezero_sdk.workspace = true

[dev-dependencies]
ctor.workspace = true
doublezero-cli-core = { workspace = true, features = ["testing"] }
doublezero-program-common.workspace = true
tempfile.workspace = true
tokio.workspace = true
