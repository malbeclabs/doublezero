name: actions-lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # actionlint 1.7.12 needs Go 1.25. Pinned here rather than read from go.mod,
      # so a PR can't change the toolchain that builds the linter.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false
      # Installed and run from outside the checkout, so no file a PR adds can stand in
      # for either tool: `pipx run zizmor==...` would run a file of that name in the
      # working directory instead.
      - name: Install actionlint and zizmor
        env:
          ZIZMOR_VERSION: v1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          cd "$RUNNER_TEMP"
          GOBIN="$RUNNER_TEMP" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz zizmor
      # zizmor fails on pull_request_target and workflow_run triggers, actions not
      # pinned to a commit SHA, a missing permissions block, and a checkout that
      # keeps its token. It runs online, and with --no-config and --no-ignores so that
      # neither a config file nor an ignore comment can switch its rules off. Every
      # workflow is linted except the ones listed here, which stay disabled until they
      # are moved (malbeclabs/infra#3034). Remove a name in the PR that hardens that
      # workflow.
      #
      # One finding is let through: `self-repository` on `uses: ./.github/actions/...`.
      # zizmor wants the `$/...` form instead, which actionlint 1.7.12 rejects
      # (rhysd/actionlint#711). The local actions are code-owned like the workflows.
      # It is filtered here by audit ID and location, not by --min-severity, so every
      # other low-severity finding still fails the job.
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
          # actionlint's shellcheck pass would otherwise read a .shellcheckrc a PR adds.
          SHELLCHECK_OPTS: --norc
        run: |
          disabled=(
            # cEOS e2e on the retired self-hosted runners
            e2e.yml
            shreds-e2e.yml
            trusted-fork-e2e.yml
            # QA (malbeclabs/infra#3182)
            qa.devnet.yml
            # Bots and notifications (malbeclabs/infra#3183)
            rfc-notification.yml
            # Deploys (malbeclabs/infra#3175)
            release.daily.yml
            release.devnet.all.daily.yml
            release.devnet.smartcontract.daily.yml
            # Releases (malbeclabs/infra#3172)
            release.agent.yml
            release.borsh-incremental.yml
            release.client.yml
            release.contributor-rewards.yml
            release.controller.yml
            release.device-telemetry-agent.yml
            release.devnet.agent.daily.yml
            release.devnet.client.daily.yml
            release.devnet.controller.daily.yml
            release.devnet.device-telemetry-agent.daily.yml
            release.devnet.doublezero.monitor.tool.yml
            release.devnet.funder.yml
            release.devnet.geoprobe-agent.daily.yml
            release.devnet.geoprobe-target.daily.yml
            release.devnet.internet-latency-collector.yml
            release.devnet.monitor.yml
            release.devnet.qa.agent.yml
            release.docker.client.cleanup.yml
            release.docker.client.devnet.yml
            release.docker.client.yml
            release.docker.core.yml
            release.doublezero-solana-cli.yml
            release.doublezero.monitor.tool.yml
            release.funder.yml
            release.geoprobe-agent.yml
            release.geoprobe-target.yml
            release.global-monitor.yml
            release.install-script.yml
            release.internet-latency-collector.yml
            release.monitor.yml
            release.offchain-scheduler.yml
            release.offchain-sentinel.yml
            release.qa.agent.yml
            release.s3-uploader.yml
            release.sdk-revdist.yml
            release.sdk-serviceability.yml
            release.sdk-telemetry.yml
            release.solana-validator-debt.yml
            release.testnet.push.tags.components.yml
            release.testnet.push.tags.yml
            release.testnet.yml
          )
          excluded=()
          for name in "${disabled[@]}"; do excluded+=(! -name "$name"); done
          mapfile -t workflows < <(find .github/workflows -name '*.y*ml' "${excluded[@]}" | sort)
          "$RUNNER_TEMP/actionlint" "${workflows[@]}"
          # Exit codes 10-14 mean findings, which the filter below judges; any other
          # nonzero code is a zizmor error.
          rc=0
          "$RUNNER_TEMP/zizmor" --no-config --no-ignores --format json "${workflows[@]}" > "$RUNNER_TEMP/zizmor.json" || rc=$?
          if [ "$rc" -ne 0 ] && { [ "$rc" -lt 10 ] || [ "$rc" -gt 14 ]; }; then
            echo "::error::zizmor exited with $rc"
            exit 1
          fi
          jq -r '
            .[]
            | select(
                .ident != "self-repository"
                or ([.locations[] | select(.symbolic.kind == "Primary") | .concrete.feature] as $f
                    | ($f | length) == 0 or any($f[]; startswith("./.github/actions/") | not))
              )
            | "\(.ident): \(.desc) at "
              + ([.locations[] | select(.symbolic.kind == "Primary")
                  | "\(.symbolic.key.Local.verbatim_path // "?"):\(.concrete.location.start_point.row + 1)"]
                 | join(", "))
          ' "$RUNNER_TEMP/zizmor.json" > "$RUNNER_TEMP/findings.txt"
          if [ -s "$RUNNER_TEMP/findings.txt" ]; then
            echo "::error::zizmor findings:"
            cat "$RUNNER_TEMP/findings.txt"
            exit 1
          fi
