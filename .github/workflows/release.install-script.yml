name: release.install-script

# Publishes client/install.sh to the CDN behind https://get.doublezero.xyz/install.
# Uploads to the doublezero-install-967501763874 S3 bucket and invalidates the CloudFront
# distribution. Auth is GitHub OIDC into a main-only deploy role (no static keys).
# Infra is documented in the infra repo runbook: install-script-hosting.md.
on:
  push:
    branches: [main]
    paths:
      - "client/install.sh"
      - "client/install-testnet.sh"
      - "client/install-devnet.sh"
      - ".github/workflows/release.install-script.yml"
  workflow_dispatch:

permissions: {}

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::967501763874:role/github-get-doublezero-install
  BUCKET: doublezero-install-967501763874
  DISTRIBUTION_ID: E3RHVENYEH05TJ

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # assume the AWS deploy role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload install scripts
        run: |
          for variant in "install:install.sh" "install-testnet:install-testnet.sh" "install-devnet:install-devnet.sh"; do
            key="${variant%%:*}"; file="client/${variant##*:}"
            aws s3 cp "$file" "s3://${BUCKET}/${key}" \
              --content-type text/x-shellscript \
              --cache-control "public,max-age=120"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/install' '/install-testnet' '/install-devnet'
