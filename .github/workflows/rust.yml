name: rust
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

jobs:
  rust-build:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install agave solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.4/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: make rust-build
  rust-lint:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make rust-lint
  rust-test:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install agave solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.4/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: make rust-test
  rust-validator-test:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install agave solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.4/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - run: make rust-validator-test
  # The doublezero CLI ships as a static musl binary so it loads on any Linux
  # regardless of the host glibc version. Build it for the musl target and assert
  # the result is fully static.
  rust-cli-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build CLI for musl and assert it is statically linked
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release -p doublezero --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/doublezero
          file "$bin"
          if file "$bin" | grep -qE "statically linked|static-pie linked"; then
            echo "OK: $bin is statically linked"
          else
            echo "::error::doublezero CLI is not statically linked"
            exit 1
          fi
  # Dry-runs the release version bump on every PR, then throws the result away.
  # The bump runs `cargo update --workspace`, which re-resolves every member's
  # dependency edges and can silently rebind them onto a different locked
  # major/minor. bump-version.sh already fails on that, but it only ran at
  # release time: the rebind that broke the v0.37.0 release (#4213, #4219) sat
  # dormant for a week. Running the real script here surfaces it on the PR that
  # causes it. The job gets its own checkout, so no other job sees the bumped
  # tree, and it compiles nothing, so no rust-cache (whose key is the very
  # Cargo.lock this job rewrites).
  release-bump-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Dry-run the release version bump
        run: |
          set -euo pipefail
          PREV=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          NEXT=$(echo "$PREV" | awk -F. '{print $1"."$2+1".0"}')
          echo "Dry-running the release bump $PREV -> $NEXT; the result is discarded."
          if ! ./scripts/release/bump-version.sh "$NEXT"; then
            echo "::error::Release version bump dry-run failed, so the next release would fail the same way. If the failure lists Cargo.lock lines, cargo update --workspace rebound a workspace dependency onto a different version: pin the offending requirement in [workspace.dependencies] to its locked minor (e.g. 0.13 rather than a bare 0). See scripts/release/bump-version.sh for the guard."
            exit 1
          fi
