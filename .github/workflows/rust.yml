name: rust
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

jobs:
  rust-build:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        # TEMPORARY, revert before merge: forces a cache miss so this run takes
        # the path #4332 failed on. Both green runs on this branch were cache
        # hits, which is the condition the failure never appears under.
        with:
          prefix-key: v0-sbf-probe
      - name: Solana toolchain
        uses: ./.github/actions/solana-toolchain
        with:
          version: v3.0.4
      - run: make rust-build
  rust-lint:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make rust-lint
  rust-test:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        # TEMPORARY, revert before merge: forces a cache miss so this run takes
        # the path #4332 failed on. Both green runs on this branch were cache
        # hits, which is the condition the failure never appears under.
        with:
          prefix-key: v0-sbf-probe
      - name: Solana toolchain
        uses: ./.github/actions/solana-toolchain
        with:
          version: v3.0.4
      - run: make rust-test
  rust-validator-test:
    runs-on: ubuntu-24.04-16c-64gb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        # TEMPORARY, revert before merge: forces a cache miss so this run takes
        # the path #4332 failed on. Both green runs on this branch were cache
        # hits, which is the condition the failure never appears under.
        with:
          prefix-key: v0-sbf-probe
      - name: Solana toolchain
        uses: ./.github/actions/solana-toolchain
        with:
          version: v3.0.4
      - run: make rust-validator-test
  # Every released CLI ships as a static musl binary so it loads on any Linux
  # regardless of the host glibc version. Build each package on its own, the way
  # goreleaser does so feature unification matches the release, and assert the
  # result is fully static. One leg per package: the builds share almost no
  # compiled output, because per-package feature resolution recompiles the
  # common crates anyway, so splitting them is close to a linear speedup.
  rust-cli-static-build:
    runs-on: ubuntu-24.04
    strategy:
      # Report every package that regressed, not just the first one.
      fail-fast: false
      matrix:
        include:
          - package: doublezero
            bin: doublezero
          - package: doublezero-solana-cli
            bin: doublezero-solana
          - package: doublezero-contributor-rewards
            bin: doublezero-contributor-rewards
          - package: doublezero-ledger-sentinel
            bin: doublezero-sentinel
          - package: doublezero-solana-validator-debt
            bin: doublezero-solana-validator-debt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          # Five legs means five cache entries where there used to be one.
          # Only main writes them, so PR runs read a main-primed cache
          # without each branch adding its own and evicting the other Rust
          # jobs' caches under the repo-wide limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.package }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build ${{ matrix.bin }} for musl and assert it is statically linked
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          bin="target/x86_64-unknown-linux-musl/release/${{ matrix.bin }}"
          cargo build --release --package ${{ matrix.package }} --target x86_64-unknown-linux-musl
          file "$bin"
          if ! file "$bin" | grep -qE "statically linked|static-pie linked"; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          echo "OK: $bin is statically linked"
  # Keeps a single stable check name now that the work fans out across the
  # matrix, so branch protection needs no change. The matrix legs still report
  # individually, so a failure names the package.
  rust-cli-static:
    runs-on: ubuntu-24.04
    needs: rust-cli-static-build
    if: always()
    steps:
      - run: '[ "${{ needs.rust-cli-static-build.result }}" = "success" ]'
  # The release bump runs `cargo update --workspace`, which can silently rebind
  # members onto a different locked minor.
  release-bump-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Dry-run the release version bump
        run: |
          set -euo pipefail
          PREV=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          NEXT=$(echo "$PREV" | awk -F. '{print $1"."$2+1".0"}')
          echo "Dry-running the release bump $PREV -> $NEXT; the result is discarded."
          if ! ./scripts/release/bump-version.sh "$NEXT"; then
            echo "Fix, if the failure lists Cargo.lock lines: either cargo update --workspace rebound a workspace dependency onto a different version, so pin the offending requirement in [workspace.dependencies] to its locked minor (0.13, not a bare 0); or a Cargo.toml dependency change landed without its regenerated lock, so run cargo update --workspace and commit the Cargo.lock. The guard lives in scripts/release/bump-version.sh."
            echo "If neither looks related to your changes, check this job on main: a loose requirement plus a PR merged since your base can rebind the tree without either PR failing on its own."
            echo "::error::The release version bump fails on this tree, so the next release would fail the same way. The cause and the fix are in this job's log."
            exit 1
          fi
