name: go
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt install -y libpcap-dev build-essential
      - run: make go-build
  go-lint:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt install -y libpcap-dev
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      - run: make go-lint
  go-test:
    runs-on: ubuntu-24.04-16c-64gb
    needs: go-build
    # Also builds the container test images (go-test-docker); see go-container-test.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo sysctl -w net.ipv4.ping_group_range="0 0"
      - run: sudo apt install -y libpcap-dev
      - name: Load the container-test base images from GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: dev/ci-ghcr-base-images.sh
      - run: make go-test nocontainertest
  go-container-test:
    runs-on: ubuntu-latest
    needs: go-build
    # The base images come from GHCR mirrors (dev/ci-ghcr-base-images.sh): Public ECR
    # throttles GitHub's shared runners. The default builder sees the tagged images; a
    # buildx container builder would not.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Load the container-test base images from GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: dev/ci-ghcr-base-images.sh
      - run: make go-container-test
  go-fuzz:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make go-fuzz
