name: dispatch-and-wait
description: Dispatch a workflow_dispatch workflow in another repo and wait for it to complete.
inputs:
  repo:
    description: 'owner/repo to dispatch in'
    required: true
  workflow:
    description: 'Workflow file name (e.g. deploy-core.testnet.yml). Must accept a correlation_id input surfaced in its run-name.'
    required: true
  ref:
    description: 'Git ref to run the workflow from'
    required: false
    default: 'main'
  fields:
    description: 'Extra inputs, one key=value per line'
    required: false
    default: ''
  token:
    description: 'Token with actions:write on the target repo'
    required: true
  slack-bot-token:
    description: >-
      Optional Slack bot token. When set together with slack-channel, posts a
      link to the dispatched run before watching it, so a run gated on a
      required-reviewer environment in the target repo gets approved instead of
      stalling unnoticed, and posts the names of the failing jobs if the run
      fails.
    required: false
    default: ''
  slack-channel:
    description: 'Slack channel ID to post the approval ping and failure report to'
    required: false
    default: ''
  slack-thread-ts:
    description: >-
      ts of a parent Slack message. When set, the posts are replies in that
      thread; when empty, they are top-level messages.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Dispatch and locate the run
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        REF: ${{ inputs.ref }}
        FIELDS: ${{ inputs.fields }}
      run: |
        set -euo pipefail
        CID="cid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
        ARGS=(-f "correlation_id=$CID")
        while IFS= read -r kv; do
          [ -n "$kv" ] && ARGS+=(-f "$kv")
        done <<< "$FIELDS"
        echo "Dispatching $WORKFLOW in $REPO with correlation id $CID"
        gh workflow run "$WORKFLOW" -R "$REPO" --ref "$REF" "${ARGS[@]}"
        RUN_ID=""
        for _ in $(seq 1 30); do
          sleep 10
          RUN_ID=$(gh run list -R "$REPO" --workflow "$WORKFLOW" --limit 20 \
            --json databaseId,displayTitle \
            --jq "[.[] | select(.displayTitle | contains(\"$CID\"))][0].databaseId // empty")
          [ -n "$RUN_ID" ] && break
        done
        if [ -z "$RUN_ID" ]; then
          echo "::error::could not find dispatched run for correlation id $CID in $REPO/$WORKFLOW"
          exit 1
        fi
        RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
        # env for the shell steps below; output for the Slack steps, whose
        # `with:` expressions cannot read values set through GITHUB_ENV.
        {
          echo "RUN_ID=$RUN_ID"
          echo "RUN_URL=$RUN_URL"
        } >> "$GITHUB_ENV"
        echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

    - name: Post approval ping to Slack
      if: inputs.slack-bot-token != '' && inputs.slack-channel != ''
      uses: ./.github/actions/slack-thread-post
      with:
        token: ${{ inputs.slack-bot-token }}
        channel: ${{ inputs.slack-channel }}
        thread-ts: ${{ inputs.slack-thread-ts }}
        text: "${{ inputs.workflow }} run in ${{ inputs.repo }} may need environment approval: ${{ steps.dispatch.outputs.run_url }}"

    - name: Watch the run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        echo "Watching $RUN_URL"
        gh run watch "$RUN_ID" -R "$REPO" --exit-status --interval 30

    # `if: failure()` in a composite scopes to this composite's own earlier
    # steps, so this fires when the watch (or the dispatch) above failed. It is
    # best-effort by design: it only warns and always exits 0 — hence no
    # `set -e` — so it can never replace or mask the failure the job is already
    # reporting.
    - name: Collect failing jobs
      id: report
      if: failure() && inputs.slack-bot-token != '' && inputs.slack-channel != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        MAX: '10'
      run: |
        set -uo pipefail
        # Empty when the dispatch step itself failed: there is no run to report on.
        if [ -z "${RUN_ID:-}" ]; then
          echo "::warning::no dispatched run to report on"
          exit 0
        fi
        # Reusable-workflow children come back as e.g. "deploy / onchain-collector-to-s3".
        NAMES=$(gh run view "$RUN_ID" -R "$REPO" --json jobs \
          --jq '.jobs[] | select(.conclusion=="failure") | .name') || {
            echo "::warning::could not list the failing jobs of $RUN_URL"
            NAMES=""
          }
        TOTAL=0
        [ -n "$NAMES" ] && TOTAL=$(printf '%s\n' "$NAMES" | wc -l | tr -d ' ')
        {
          echo 'text<<SLACK_TEXT_EOF'
          echo "*$WORKFLOW failed in $REPO*"
          echo "$RUN_URL"
          if [ "$TOTAL" -eq 0 ]; then
            # Cancelled run, a run that failed without a failed job, or the
            # query above erroring out.
            echo '_No failing jobs were reported — see the run for details._'
          else
            echo 'Failed jobs:'
            printf '%s\n' "$NAMES" | head -n "$MAX" | sed 's/^/• /'
            [ "$TOTAL" -gt "$MAX" ] && echo "_… and $((TOTAL - MAX)) more_"
          fi
          echo 'SLACK_TEXT_EOF'
        } >> "$GITHUB_OUTPUT"
        exit 0

    # Empty text means the step above was skipped (no Slack config) or bailed out.
    - name: Post failure report to Slack
      if: failure() && steps.report.outputs.text != ''
      uses: ./.github/actions/slack-thread-post
      with:
        token: ${{ inputs.slack-bot-token }}
        channel: ${{ inputs.slack-channel }}
        thread-ts: ${{ inputs.slack-thread-ts }}
        color: danger
        text: ${{ steps.report.outputs.text }}
