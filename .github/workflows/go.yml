name: go
on:
  push:
    branches: [ main, 'hotfix/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt install -y libpcap-dev build-essential
      - run: make go-build
  go-lint:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt install -y libpcap-dev
      # A fixed version: `latest` moved to v2.15.0, whose new checks fail on code that
      # passed v2.14.0. Bump it in its own PR, with the fixes it asks for.
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
      - run: make go-lint
  go-test:
    runs-on: ubuntu-24.04-16c-64gb
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo sysctl -w net.ipv4.ping_group_range="0 0"
      - run: sudo apt install -y libpcap-dev
      - run: make go-test nocontainertest
  go-container-test:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: make go-container-test
  go-fuzz:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make go-fuzz
