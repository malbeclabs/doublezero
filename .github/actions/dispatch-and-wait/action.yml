name: dispatch-and-wait
description: Dispatch a workflow_dispatch workflow in another repo and wait for it to complete.
inputs:
  repo:
    description: 'owner/repo to dispatch in'
    required: true
  workflow:
    description: 'Workflow file name (e.g. deploy-core.testnet.yml). Must accept a correlation_id input surfaced in its run-name.'
    required: true
  ref:
    description: 'Git ref to run the workflow from'
    required: false
    default: 'main'
  fields:
    description: 'Extra inputs, one key=value per line'
    required: false
    default: ''
  token:
    description: 'Token with actions:write on the target repo'
    required: true
  slack-bot-token:
    description: >-
      Optional Slack bot token. When set together with slack-channel, posts a
      link to the dispatched run before watching it, so a run gated on a
      required-reviewer environment in the target repo gets approved instead of
      stalling unnoticed, and posts the names of the failing jobs if the run
      fails.
    required: false
    default: ''
  slack-channel:
    description: 'Slack channel ID to post the approval ping and failure report to'
    required: false
    default: ''
  slack-thread-ts:
    description: >-
      ts of a parent Slack message. When set, the posts are replies in that
      thread; when empty, they are top-level messages.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Dispatch and locate the run
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        REF: ${{ inputs.ref }}
        FIELDS: ${{ inputs.fields }}
      run: |
        set -euo pipefail
        CID="cid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
        ARGS=(-f "correlation_id=$CID")
        while IFS= read -r kv; do
          [ -n "$kv" ] && ARGS+=(-f "$kv")
        done <<< "$FIELDS"
        echo "Dispatching $WORKFLOW in $REPO with correlation id $CID"
        gh workflow run "$WORKFLOW" -R "$REPO" --ref "$REF" "${ARGS[@]}"
        RUN_ID=""
        for _ in $(seq 1 30); do
          sleep 10
          RUN_ID=$(gh run list -R "$REPO" --workflow "$WORKFLOW" --limit 20 \
            --json databaseId,displayTitle \
            --jq "[.[] | select(.displayTitle | contains(\"$CID\"))][0].databaseId // empty")
          [ -n "$RUN_ID" ] && break
        done
        if [ -z "$RUN_ID" ]; then
          echo "::error::could not find dispatched run for correlation id $CID in $REPO/$WORKFLOW"
          exit 1
        fi
        RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
        {
          echo "run_id=$RUN_ID"
          echo "run_url=$RUN_URL"
        } >> "$GITHUB_OUTPUT"

    - name: Post approval ping to Slack
      if: inputs.slack-bot-token != '' && inputs.slack-channel != ''
      uses: ./.github/actions/slack-thread-post
      with:
        token: ${{ inputs.slack-bot-token }}
        channel: ${{ inputs.slack-channel }}
        thread-ts: ${{ inputs.slack-thread-ts }}
        text: "${{ inputs.workflow }} run in ${{ inputs.repo }} may need environment approval: ${{ steps.dispatch.outputs.run_url }}"

    - name: Watch the run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        RUN_URL: ${{ steps.dispatch.outputs.run_url }}
      run: |
        set -euo pipefail
        echo "Watching $RUN_URL"
        gh run watch "$RUN_ID" -R "$REPO" --exit-status --interval 30

    # Status functions in a composite scope to this composite's own earlier
    # steps, so this fires when the watch (or the dispatch) above failed.
    # `cancelled()` covers the calling job hitting its own `timeout-minutes`,
    # where `failure()` is false and the thread would otherwise hear nothing
    # about a stalled stage. It is best-effort by design: it only warns and
    # always exits 0 — hence no `set -e` — so it can never replace or mask the
    # failure the job is already reporting.
    - name: Collect failing jobs
      id: report
      if: (failure() || cancelled()) && inputs.slack-bot-token != '' && inputs.slack-channel != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        MAX: '10'
      run: |
        set -uo pipefail
        # Empty when the dispatch step itself failed: there is no run to report on.
        if [ -z "${RUN_ID:-}" ]; then
          echo "::warning::no dispatched run to report on"
          exit 0
        fi
        RUN_JSON=$(gh run view "$RUN_ID" -R "$REPO" --json status,conclusion,jobs) || {
          echo "::warning::could not query $RUN_URL"
          RUN_JSON=''
        }
        OUTCOME=unknown
        NAMES=''
        if [ -n "$RUN_JSON" ]; then
          # gh renders a not-yet-concluded run or job as "", not null. On the
          # cancelled path the dispatched run is usually still going, so report
          # its status rather than claiming it failed.
          OUTCOME=$(printf '%s' "$RUN_JSON" \
            | jq -r '[.conclusion, .status, "unknown"] | map(select(. != null and . != "")) | first')
          # Concluded and not fine: failure, timed_out, cancelled, action_required.
          # Reusable-workflow children come back as e.g. "deploy / onchain-collector-to-s3".
          NAMES=$(printf '%s' "$RUN_JSON" | jq -r '.jobs[]
            | select((.conclusion // "") | . != "" and . != "success" and . != "skipped")
            | "\(.name) (\(.conclusion))"')
        fi
        TOTAL=0
        [ -n "$NAMES" ] && TOTAL=$(printf '%s\n' "$NAMES" | wc -l | tr -d ' ')
        {
          echo 'text<<SLACK_TEXT_EOF'
          echo "*$WORKFLOW in $REPO: $OUTCOME*"
          echo "$RUN_URL"
          if [ "$TOTAL" -eq 0 ]; then
            # A run that failed with no failed job, one still in flight because
            # the caller was cancelled out from under it, or the query above
            # erroring out.
            echo '_No failed jobs to name — see the run for details._'
          else
            echo 'Failed jobs:'
            printf '%s\n' "$NAMES" | head -n "$MAX" | sed 's/^/• /'
            [ "$TOTAL" -gt "$MAX" ] && echo "_… and $((TOTAL - MAX)) more_"
          fi
          echo 'SLACK_TEXT_EOF'
        } >> "$GITHUB_OUTPUT"
        exit 0

    # Empty text means the step above was skipped (no Slack config) or bailed out.
    - name: Post failure report to Slack
      if: (failure() || cancelled()) && steps.report.outputs.text != ''
      uses: ./.github/actions/slack-thread-post
      with:
        token: ${{ inputs.slack-bot-token }}
        channel: ${{ inputs.slack-channel }}
        thread-ts: ${{ inputs.slack-thread-ts }}
        color: danger
        text: ${{ steps.report.outputs.text }}
