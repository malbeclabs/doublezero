[package]
name = "doublezero-builder-stake-admin-cli"
version = "0.0.1"

# Workspace inherited keys
edition = "2024"
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
doublezero-builder-stake.workspace = true
doublezero-program-tools.workspace = true
doublezero-solana-client-tools.workspace = true
solana-sdk.workspace = true
tokio.workspace = true

[features]
default = []
### Build with this feature to talk to the devnet and localnet deployments, which carry a
### different 2Z mint. It has to match the program's own build flavor.
development = ["doublezero-builder-stake/development"]

[[bin]]
name = "doublezero-builder-stake-admin"
path = "src/main.rs"
